name: Build MSI
description: Restores third-party dependencies and builds the installer for one configuration.

inputs:
  configuration:
    description: MSBuild configuration to build (Debug or Release).
    required: true
  version:
    description: Four-part version to stamp into the binaries.
    required: false
    default: 0.0.0.0

outputs:
  msi-path:
    description: Path to the built MSI.
    value: WiXSetup/bin/x64/${{ inputs.configuration }}/en-us/eduMFACredentialProviderSetup.msi
  stamped-version:
    description: The version string compiled into the binaries, as SignPath must see it.
    value: ${{ steps.build.outputs.stamped-version }}

runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Setup dependencies
      run: ./scripts/setup-dependencies.ps1
      shell: pwsh

    - name: Build ${{ inputs.configuration }}
      id: build
      shell: pwsh
      run: |
        $commit = '${{ github.sha }}'.Substring(0, 7)
        "stamped-version=${{ inputs.version }}-$commit" >> $env:GITHUB_OUTPUT
        msbuild EduMFA-CredentialProvider.sln `
          /p:Configuration=${{ inputs.configuration }} `
          /p:Platform=x64 `
          /p:VisualStudioVersion=17.0 `
          /p:Version=${{ inputs.version }} `
          /p:VersionCommit=$commit `
          /m `
          /v:minimal

    # Every project links the CRT statically (/MT), so the installer ships no VC runtime. Fail if a
    # DLL starts importing one, because it would not load on machines without the VC redist.
    - name: Check DLLs do not import the VC runtime
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $dumpbin = & $vswhere -latest -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
        if (-not $dumpbin) { throw 'dumpbin.exe not found' }
        $dlls = Get-ChildItem CredentialProvider, CredentialProviderFilter -Recurse -Filter *.dll |
          Where-Object { $_.DirectoryName -like '*\bin\x64\${{ inputs.configuration }}' }
        if ($dlls.Count -ne 2) { throw "Expected 2 DLLs, found $($dlls.Count)" }
        foreach ($dll in $dlls) {
          $imports = & $dumpbin /nologo /dependents $dll.FullName | Select-String -Pattern '^\s+\S+\.dll\s*$'
          Write-Host "$($dll.Name): $(($imports | ForEach-Object { $_.Line.Trim() }) -join ', ')"
          $crt = $imports | Where-Object { $_.Line -match '(?i)\b(vcruntime|msvcp|concrt)\w*\.dll' }
          if ($crt) { throw "$($dll.Name) imports the VC runtime: $(($crt | ForEach-Object { $_.Line.Trim() }) -join ', ')" }
        }
