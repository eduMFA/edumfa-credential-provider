name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

# Both jobs run on Linux so anyone can run the same checks locally without Windows, with xwin
# supplying the MSVC, Windows SDK and ATL headers that clang-tidy needs.
jobs:
  clang-format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Pinned because clang-format output changes between major versions.
      - name: Install clang-format
        run: pipx install clang-format==21.1.8

      - name: Check formatting
        run: git ls-files '*.cpp' '*.h' | xargs clang-format --dry-run --Werror

  clang-tidy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      XWIN_VERSION: 0.10.0
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install clang-tidy
        run: pipx install clang-tidy==21.1.6

      - name: Setup dependencies
        run: ./scripts/setup-dependencies.ps1
        shell: pwsh

      - name: Cache Windows headers
        id: xwin-cache
        uses: actions/cache@v6
        with:
          path: xwin
          key: xwin-${{ env.XWIN_VERSION }}-x86_64-atl

      - name: Download Windows headers
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-x86_64-unknown-linux-musl.tar.gz" | tar xz
          "./xwin-$XWIN_VERSION-x86_64-unknown-linux-musl/xwin" --accept-license --temp --arch x86_64 --include-atl splat --output xwin
          # Linting only needs the headers. This keeps the cache at about a third of its size.
          rm -rf xwin/crt/lib xwin/sdk/lib xwin/sdk/include/cppwinrt

      # Flags come from compile_flags.txt in the repo root.
      - name: Run clang-tidy
        run: git ls-files '*.cpp' | xargs -P"$(nproc)" -n1 clang-tidy --quiet --warnings-as-errors='*'
